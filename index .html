<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B2A5C">
<title>سنتر الدحيح - المراجعة النهائية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2A5C;--teal:#14192D;--teal2:#0F766E;--turq:#14B8A6;--gold:#FFC93C;--orange:#FF8A1F;--cream:#F7F5EF;--wall:#ECE8DC;--line:#CFC9B8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--navy);color:#fff;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;direction:rtl}
a{text-decoration:none;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
section{padding:64px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:60px;padding:0 32px;border-radius:16px;font-family:inherit;font-size:22px;font-weight:900;cursor:pointer;border:0}
.btn-gold{background:var(--orange);color:var(--navy)}
.btn-line{border:2px solid var(--gold);color:#fff;font-weight:700;background:transparent}
.btn-navy{background:var(--navy);color:var(--gold)}
.chip{display:inline-block;background:var(--gold);color:var(--navy);font-weight:900;border-radius:12px;padding:4px 18px 6px}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-top:18px;padding-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;font-size:32px;font-weight:900}
.brand .chip{font-size:16px;padding:2px 12px 4px;border-radius:10px}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px}
nav a{font-size:19px;font-weight:700;padding:8px 4px}
nav a.cta{background:var(--orange);color:var(--navy);font-weight:900;padding:0 22px;min-height:48px;display:inline-flex;align-items:center;border-radius:14px}
.hero{background:var(--teal)}
.hero .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:48px;padding-top:56px;padding-bottom:56px}
.hero-text{flex:1 1 460px;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:22px}
.hero h1{font-size:clamp(38px,5.4vw,60px);line-height:1.25;font-weight:900}
.hero h1 .l2{color:var(--gold)}
.hero p{font-size:22px;line-height:1.7;font-weight:600;max-width:560px}
.row{display:flex;flex-wrap:wrap;gap:14px}
.tag{background:var(--cream);color:var(--navy);font-size:19px;font-weight:700;padding:6px 16px;border-radius:12px}
.hero-img{flex:0 1 470px;min-width:280px;margin:0 auto}
.teacher-frame{background:var(--cream);border:4px solid var(--gold);border-radius:28px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.teacher-frame img{display:block;width:100%;height:auto}
.inside-img{display:block;width:100%;max-width:460px;aspect-ratio:3/4;object-fit:cover;border:4px solid var(--gold);border-radius:26px;margin:0 auto}
h2{font-size:42px;line-height:1.3;font-weight:900}
.sec-head{display:flex;flex-direction:column;gap:8px;margin-bottom:32px}
.sec-head p{font-size:21px;line-height:1.6;font-weight:600}
.grid{display:flex;flex-wrap:wrap;gap:20px}
.card{flex:1 1 300px;min-width:0;background:var(--cream);border:3px solid var(--gold);border-radius:24px;padding:24px;color:var(--navy);display:flex;flex-direction:column;gap:10px}
.card h3{font-size:26px;line-height:1.3;font-weight:900}
.card p{font-size:19px;line-height:1.7;font-weight:600}
.about-intro{font-size:22px;line-height:1.9;font-weight:600;max-width:900px}
.vm{border-color:var(--turq)}
.vm .ic{font-size:15px;font-weight:900;background:var(--navy);color:var(--gold);align-self:flex-start;border-radius:10px;padding:2px 14px 4px}
#about h2,#features h2,#inside h2,#teachers h2,#booking h2{color:var(--gold)}
#subjects{background:var(--wall);color:var(--navy)}
.group{gap:12px;padding:20px}
.group .gh{background:var(--gold);font-size:26px;font-weight:900;text-align:center;padding:2px 0 6px;border-radius:14px}
.srow{background:#fff;border-radius:14px;padding:8px 16px;display:flex;flex-direction:column}
.srow b{font-size:23px;line-height:1.4;font-weight:900}
.srow small{font-size:16px;line-height:1.4;font-weight:600;color:var(--teal2)}
#teachers{background:var(--teal)}
.tcard{flex:1 1 240px;align-items:center;text-align:center}
.tphoto{width:132px;height:132px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);background:#fff;display:block}
.wa-icon{width:28px;height:28px;flex:none;display:block;object-fit:contain}
.js-waicon{display:inline-flex}
.mapbox{flex:2 1 420px;min-width:0;min-height:340px;border:4px solid var(--gold);border-radius:24px;overflow:hidden;background:#fff}
.mapbox iframe{display:block;width:100%;height:100%;min-height:340px;border:0}
.fabwa{position:fixed;right:16px;bottom:16px;z-index:998;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 22px 0 18px;border-radius:28px;background:var(--navy);color:var(--gold);border:3px solid var(--gold);font-size:19px;font-weight:900;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.tpic{position:relative;display:inline-block;line-height:0}
.tbadge{position:absolute;bottom:2px;left:-6px;min-width:48px;height:48px;padding:0 10px;border-radius:24px;background:var(--navy);color:var(--gold);border:3px solid var(--gold);font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;direction:ltr;line-height:1}
.tcard span:not(.tbadge){font-size:19px;font-weight:700;color:var(--teal2)}
#booking .wrap{max-width:920px}
.formcard{background:var(--cream);border:4px solid var(--gold);border-radius:28px;padding:32px 28px;color:var(--navy)}
form{display:flex;flex-direction:column;gap:22px}
.fields{display:flex;flex-wrap:wrap;gap:18px}
.field{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:8px}
label,legend{font-size:20px;line-height:1.4;font-weight:900}
input,select,textarea{font-family:inherit;color:var(--navy)}
.field input,.field select{height:56px;border:2px solid var(--line);border-radius:14px;padding:0 16px;font-size:19px;font-weight:600;background:#fff;width:100%}
.field input[type=tel]{direction:ltr;text-align:right}
fieldset{margin:0;padding:0;border:0;min-width:0;display:flex;flex-direction:column;gap:12px}
legend{padding:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.sub{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:58px;padding:8px 18px;border-radius:16px;font-family:inherit;text-align:right;cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--navy)}
.sub b{font-size:20px;line-height:1.3;font-weight:900}
.sub small{font-size:14px;line-height:1.3;font-weight:600}
.sub[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--gold)}
.hint{margin:0;font-size:18px;line-height:1.6;font-weight:600;color:#4a5568}
.err{background:#ffe4dc;border:2px solid #b3361b;color:#7a1d0a;border-radius:14px;padding:12px 16px;font-size:19px;line-height:1.5;font-weight:700}
.summary{background:#fff;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;font-size:20px;line-height:1.6;font-weight:600}
[hidden]{display:none!important}
footer{background:var(--teal);border-top:6px solid var(--gold)}
footer .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:24px;padding-bottom:24px}
footer b{font-size:24px;font-weight:900}
footer span{font-size:20px;font-weight:700;color:var(--gold)}
@media (max-width:600px){h2{font-size:32px}.formcard{padding:22px 16px}section{padding:48px 0}}

/* ===== وضع التعديل ===== */
#editPanel{position:fixed;top:0;left:0;bottom:0;width:min(430px,100vw);background:#fff;color:var(--navy);z-index:1000;overflow:auto;box-shadow:6px 0 30px rgba(0,0,0,.35);padding:16px;direction:rtl;font-size:16px;line-height:1.5}
#editPanel .ehead{position:sticky;top:-16px;background:#fff;padding:12px 0;margin:-16px 0 8px;z-index:2;border-bottom:3px solid var(--gold)}
#editPanel h2{font-size:24px;color:var(--navy)}
#editPanel .enote{font-size:14px;font-weight:600;margin:6px 0 10px;color:#334}
#editPanel .ebar{display:flex;flex-wrap:wrap;gap:8px}
.ebtn{font-family:inherit;font-size:15px;font-weight:700;border-radius:10px;border:2px solid var(--navy);background:#fff;color:var(--navy);padding:7px 12px;cursor:pointer;min-height:40px}
.ebtn.main{background:var(--navy);color:var(--gold)}
.ebtn.del{border-color:#b3361b;color:#b3361b}
.ebtn.add{border-style:dashed}
#editPanel details{border:2px solid #E4DFD0;border-radius:14px;margin:10px 0;background:#FBFAF6}
#editPanel summary{cursor:pointer;font-weight:900;font-size:18px;padding:10px 14px}
#editPanel .ebody{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}
#editPanel .ef{display:flex;flex-direction:column;gap:4px}
#editPanel .ef label{font-size:14px;font-weight:700}
#editPanel .ef input,#editPanel .ef textarea{border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px;font-weight:600;background:#fff;width:100%}
#editPanel .ef small{font-size:13px;color:#556}
#editPanel .erow{border:2px solid #E4DFD0;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fff}
#editPanel .egroup{border:3px solid var(--gold);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;background:#fff}
#editFab{position:fixed;left:16px;bottom:16px;z-index:999;min-height:52px;padding:0 20px;border-radius:26px;border:3px solid var(--gold);background:var(--navy);color:var(--gold);font-family:inherit;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.trophy-box{margin-top:22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.trophy-box svg{width:150px;height:auto;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.trophy-box p{font-size:24px;line-height:1.5;font-weight:900;color:var(--gold)}
</style>
</head>

<header>
<div class="wrap">
<div class="brand"><span data-t="brand"></span><span class="chip" data-t="badge"></span></div>
<nav aria-label="روابط الصفحة">
<a href="#about">من نحن</a>

</div>

<script>
(function () {
var embedded = document.getElementById('cfgData').textContent;
var cfg = JSON.parse(embedded);
var KEY = 'daheeh_landing_cfg';
function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; } return String(h); }
var base = hash(embedded);
try {
var st = JSON.parse(localStorage.getItem(KEY) || 'null');
if (st && st.base === base && st.cfg) cfg = st.cfg;
} catch (e) {}
function persist() { try { localStorage.setItem(KEY, JSON.stringify({ base: base, cfg: cfg })); } catch (e) {} }

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var tick = '<svg width="40" height="40" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="17" fill="#0e7a80"/><path d="M9.5 17.5l5 5 10-10.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var person = '<svg width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="صورة المدرس"><circle cx="42" cy="42" r="42" fill="#0f2747"/><circle cx="42" cy="32" r="14" fill="#f4b63f"/><path d="M14 74c3-16 14-24 28-24s25 8 28 24" fill="#f4b63f"/></svg>';

var picked = {};
var flat = [];

function render() {
Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = cfg[el.getAttribute('data-t')] || ''; });
document.title = (cfg.brand || '') + ' - المراجعة النهائية';
$('footBrand').textContent = (cfg.brand || '') + ' · ' + (cfg.badge || '');
$('footPhone').textContent = 'للحجز والاستفسار: ' + (cfg.phone || '');
var _d = String(cfg.whatsapp || '').replace(/\D/g, '');
var _wa = _d ? 'https://wa.me/' + _d : '#booking';
var _ic = (cfg.wa && cfg.wa.photo) ? '<img class="wa-icon" alt="" src="' + esc(cfg.wa.photo) + '">' : '<svg class="wa-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C8.8 3 3 8.4 3 15c0 2.6.9 5 2.4 7L4 29l7.3-2.2c1.4.6 3 .9 4.7.9 7.2 0 13-5.4 13-12S23.2 3 16 3z" fill="#14B8A6"/><circle cx="10.5" cy="15.5" r="1.8" fill="#fff"/><circle cx="16" cy="15.5" r="1.8" fill="#fff"/><circle cx="21.5" cy="15.5" r="1.8" fill="#fff"/></svg>';
Array.prototype.forEach.call(document.querySelectorAll('.js-waicon'), function (el) { el.innerHTML = _ic; });
$('waLink').href = _wa; $('waFab').href = _wa; $('waFab').hidden = !_d;
var _q = encodeURIComponent(cfg.mapQuery || cfg.address || '');
$('mapLink').href = 'https://www.google.com/maps/search/?api=1&query=' + _q;
var _mf = $('mapFrame'); if (_mf && _mf.getAttribute('data-q') !== _q) { _mf.setAttribute('data-q', _q); _mf.src = 'https://www.google.com/maps?q=' + _q + '&output=embed'; }
$('locAddr').textContent = 'العنوان: ' + (cfg.address || '');
$('locAddr2').textContent = cfg.address || '';
$('footAddress').textContent = 'العنوان: ' + (cfg.address || '');
$('bookAddr').textContent = 'العنوان: ' + (cfg.address || '');
$('tagList').innerHTML = cfg.tags.map(function (t) { return '<span class="tag">' + esc(t.t) + '</span>'; }).join('');
$('featureList').innerHTML = cfg.features.map(function (f) { return '<div class="card">' + tick + '<h3>' + esc(f.t) + '</h3><p>' + esc(f.d) + '</p></div>'; }).join('');
$('subjectGroups').innerHTML = cfg.groups.map(function (g) {
return '<div class="card group"><div class="gh">' + esc(g.name) + '</div>' + g.subjects.map(function (s) {
return '<div class="srow"><b>' + esc(s.n) + '</b><small>' + esc(s.teacher) + '</small></div>'; }).join('') + '</div>';
}).join('');
$('teacherList').innerHTML = cfg.teachers.map(function (t) {
return '<div class="card tcard"><div class="tpic">' + (t.photo ? '<img class="tphoto" src="' + esc(t.photo) + '" alt="' + esc(t.name) + '">' : person) + (t.badge ? '<span class="tbadge">' + esc(t.badge) + '</span>' : '') + '</div><h3>' + esc(t.name) + '</h3><span>' + esc(t.subject) + '</span></div>';
}).join('');
renderTracks();
renderChips();
}
function visibleSubjects() {
var tr = $('f-track').value;
if (!tr) return null;
var out = [];
cfg.groups.forEach(function (g) {
var tl = String(g.tracks || '').split(/[,،]/).map(function (x) { return x.trim(); }).filter(Boolean);
if (!tl.length || tl.indexOf(tr) !== -1) g.subjects.forEach(function (s) { out.push(s); });
});
return out;
}
function renderTracks() {
var sel = $('f-track'); var cur = sel.value;
sel.innerHTML = '<option value="">اختار الشعبة</option>' + cfg.tracks.map(function (t) { return '<option>' + esc(t.t) + '</option>'; }).join('');
sel.value = cur;
if (sel.value !== cur) sel.value = '';
}
function renderChips() {
var vis = visibleSubjects();
if (!vis) { flat = []; picked = {}; $('chipList').innerHTML = '<p class="hint">اختار الشعبة الأول عشان تظهر موادها.</p>'; return; }
flat = vis;
var keep = {}; flat.forEach(function (s) { if (picked[s.n]) keep[s.n] = true; }); picked = keep;
$('chipList').innerHTML = flat.map(function (s, i) {
return '<button type="button" class="sub" data-i="' + i + '" aria-pressed="' + (picked[s.n] ? 'true' : 'false') + '"><b>' + esc(s.n) + '</b><small>' + esc(s.teacher) + '</small></button>';
}).join('');
}

$('f-track').addEventListener('change', function () { picked = {}; renderChips(); $('err').hidden = true; });
$('chipList').addEventListener('click', function (e) {
var b = e.target.closest('.sub'); if (!b) return;
var s = flat[+b.getAttribute('data-i')]; if (!s) return;
picked[s.n] = !picked[s.n];
b.setAttribute('aria-pressed', picked[s.n] ? 'true' : 'false');
$('err').hidden = true;
});

$('bookForm').addEventListener('submit', function (e) {
e.preventDefault();
var name = $('f-name').value.trim();
var phone = $('f-phone').value.replace(/\D/g, '');
var parent = $('f-parent').value.trim();
var track = $('f-track').value;
var names = flat.filter(function (s) { return picked[s.n]; }).map(function (s) { return s.n; });
var err = '';
if (name.length < 3) err = 'اكتب اسم الطالب.';
else if (!/^01\d{9}$/.test(phone)) err = 'اكتب رقم موبايل صحيح مكوّن من 11 رقم يبدأ بـ 01.';
else if (!track) err = 'اختار الشعبة.';
else if (!names.length) err = 'اختار مادة واحدة على الأقل.';
if (err) { $('err').textContent = err; $('err').hidden = false; return; }
$('err').hidden = true;
$('summary').innerHTML =
'<span>الاسم: <strong>' + esc(name) + '</strong></span>' +
'<span>رقم الطالب: <strong>' + esc(phone) + '</strong></span>' +
'<span>رقم ولي الأمر: <strong>' + esc(parent || '-') + '</strong></span>' +
'<span>الشعبة: <strong>' + esc(track) + '</strong></span>' +
'<span>المواد: <strong>' + esc(names.join('، ')) + '</strong></span>';
var msg = ['حجز جديد - المراجعة النهائية', 'الاسم: ' + name, 'رقم الطالب: ' + phone, 'رقم ولي الأمر: ' + (parent || '-'), 'الشعبة: ' + track, 'المواد: ' + names.join('، ')].join('\n');
var digits = String(cfg.whatsapp || '').replace(/\D/g, '');
$('waBtn').href = digits ? 'https://wa.me/' + digits + '?text=' + encodeURIComponent(msg) : '#booking';
$('bookForm').hidden = true;
$('review').hidden = false;
});

/* ===== وضع التعديل: افتح الملف بالرابط  ...landing.html#edit ===== */
var uid = 0;
function h(tag, props, kids) {
var e = document.createElement(tag);
Object.keys(props || {}).forEach(function (k) {
var v = props[k];
if (k === 'text') e.textContent = v;
else if (k === 'class') e.className = v;
else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
else e.setAttribute(k, v);
});
(kids || []).forEach(function (c) { e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
return e;
}
function changed() { persist(); render(); if (window.__redrawTeachers) window.__redrawTeachers(); }
function field(label, obj, key, multi, hint) {
var id = 'ef' + (++uid);
var inp = multi ? h('textarea', { id: id, rows: '3' }) : h('input', { id: id, type: 'text' });
inp.value = obj[key] || '';
inp.addEventListener('input', function () { obj[key] = inp.value; changed(); });
var wrap = h('div', { class: 'ef' }, [h('label', { 'for': id, text: label }), inp]);
if (hint) wrap.appendChild(h('small', { text: hint }));
return wrap;
}
function listEditor(box, arr, fields, makeNew, addLabel) {
function redo() { listEditor(box, arr, fields, makeNew, addLabel); }
box.innerHTML = '';
arr.forEach(function (item, i) {
var row = h('div', { class: 'erow' });
fields.forEach(function (f) { row.appendChild(f.photo ? photoField(item) : field(f.label, item, f.k, f.multi)); });
row.appendChild(h('button', { type: 'button', class: 'ebtn del', text: 'حذف', onclick: function () { arr.splice(i, 1); changed(); redo(); } }));
box.appendChild(row);
});
box.appendChild(h('button', { type: 'button', class: 'ebtn add', text: addLabel || '+ إضافة', onclick: function () { arr.push(makeNew()); changed(); redo(); } }));
}
function section(title, open) {
var body = h('div', { class: 'ebody' });
var d = h('details', open ? { open: 'open' } : {}, [h('summary', { text: title }), body]);
return { d: d, body: body };
}
function photoField(item, label) {
var id = 'ef' + (++uid);
var inp = h('input', { id: id, type: 'file', accept: 'image/*' });
inp.addEventListener('change', function () {
var f = inp.files && inp.files[0]; if (!f) return;
var rd = new FileReader();
rd.onload = function () {
var im = new Image();
im.onload = function () {
var side = Math.min(im.width, im.height);
var out = Math.min(480, side);
var c = document.createElement('canvas'); c.width = out; c.height = out;
c.getContext('2d').drawImage(im, (im.width - side) / 2, (im.height - side) / 2, side, side, 0, 0, out, out);
item.photo = c.toDataURL('image/webp', 0.9);
changed();
};
im.src = rd.result;
};
rd.readAsDataURL(f);
});
var w = h('div', { class: 'ef' }, [h('label', { 'for': id, text: label || 'صورة المدرس (بتتقص مربعة من النص)' }), inp]);
if (item.photo) w.appendChild(h('button', { type: 'button', class: 'ebtn del', text: 'إزالة الصورة', onclick: function () { item.photo = ''; changed(); } }));
return w;
}
function imageField(label, imgId, mime, maxSide) {
var id = 'ef' + (++uid);
var inp = h('input', { id: id, type: 'file', accept: 'image/*' });
inp.addEventListener('change', function () {
var f = inp.files && inp.files[0]; if (!f) return;
var rd = new FileReader();
rd.onload = function () {
var im = new Image();
im.onload = function () {
var sc = Math.min(1, maxSide / Math.max(im.width, im.height));
var c = document.createElement('canvas');
c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
$(imgId).src = c.toDataURL(mime, 0.9);
};
im.src = rd.result;
};
rd.readAsDataURL(f);
});
return h('div', { class: 'ef' }, [h('label', { 'for': id, text: label }), inp, h('small', { text: 'الصورة بتتحفظ في النسخة اللي بتنزّلها بزر «حفظ نسخة HTML».' })]);
}
function buildHtml() {
var clone = document.documentElement.cloneNode(true);
['editPanel', 'editFab'].forEach(function (id) { var n = clone.querySelector('#' + id); if (n) n.remove(); });
clone.querySelector('#cfgData').textContent = '\n' + JSON.stringify(cfg, null, 1).replace(/</g, '\\u003c') + '\n';
var bf = clone.querySelector('#bookForm'); bf.removeAttribute('hidden');
clone.querySelector('#review').setAttribute('hidden', '');
clone.querySelector('#err').setAttribute('hidden', '');
return '<!doctype html>\n' + clone.outerHTML;
}
function download() {
var blob = new Blob([buildHtml()], { type: 'text/html;charset=utf-8' });
var a = document.createElement('a');
a.href = URL.createObjectURL(blob); a.download = 'landing.html';
document.body.appendChild(a); a.click();
setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function buildPanel() {
var old = $('editPanel'); if (old) old.remove();
var oldFab = $('editFab'); if (oldFab) oldFab.remove();
var panel = h('div', { id: 'editPanel' });
var fab = h('button', { id: 'editFab', type: 'button', text: 'تعديل', hidden: '', onclick: function () { panel.hidden = false; fab.hidden = true; } });
panel.appendChild(h('div', { class: 'ehead' }, [
h('h2', { text: 'وضع التعديل' }),
h('p', { class: 'enote', text: 'غيّر أي نص وهتشوف التغيير فورًا. التعديلات بتتحفظ في المتصفح ده، وعشان تنشرها اضغط «حفظ نسخة HTML» وارفع الملف الجديد.' }),
h('div', { class: 'ebar' }, [
h('button', { type: 'button', class: 'ebtn main', text: 'حفظ نسخة HTML', onclick: download }),
h('button', { type: 'button', class: 'ebtn', text: 'إعادة الضبط', onclick: function () {
if (!confirm('هترجع كل النصوص للقيم الأصلية في الملف. متأكد؟')) return;
try { localStorage.removeItem(KEY); } catch (e) {}
cfg = JSON.parse(embedded); render(); buildPanel();
} }),
h('button', { type: 'button', class: 'ebtn', text: 'إخفاء', onclick: function () { panel.hidden = true; fab.hidden = false; } })
])
]));

var s3 = section('المميزات');

var trBox = h('div', { class: 'ebody', style: 'padding:0' });
listEditor(trBox, cfg.tracks, [{ k: 't', label: 'اسم الشعبة' }], function () { return { t: 'شعبة جديدة' }; }, '+ إضافة شعبة');
